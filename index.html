<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance & Loan Dashboard</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f7f6">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background: #f4f7f6; padding: 15px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    select, input, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    
    .btn-pdf { background: #8e44ad; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-pdf:hover { background: #732d91; }

    /* KPI Cards */
    .kpi-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .kpi-card { background: white; padding: 15px 10px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
    .kpi-card h3 { font-size: 0.8rem; color: #666; margin-bottom: 3px; }
    .kpi-card p.amount { font-size: 1.2rem; font-weight: bold; }
    .kpi-card p.sub-text { font-size: 0.7rem; color: #777; margin-top: 4px; }

    .income { color: #27ae60; } 
    .expense { color: #e74c3c; } 
    .balance { color: #2980b9; }

    /* Loan Summary Box */
    .loan-box { background: #fef9e7; border-left: 4px solid #f39c12; padding: 12px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 0.85rem; }
    .loan-box div { text-align: center; }
    .loan-box strong { display: block; font-size: 1rem; margin-top: 2px; }

    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
    form { display: flex; flex-direction: column; gap: 8px; }
    button.submit-btn { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    th { background: #fafafa; }
    .action-btn-cell { text-align: right; white-space: nowrap; }
    .action-btn { padding: 4px 6px; font-size: 0.75rem; border-radius: 4px; border: none; color: white; cursor: pointer; }
    .edit-btn { background: #f39c12; }
    .delete-btn { background: #e74c3c; margin-left: 2px; }

    @media(min-width: 768px) {
      body { padding: 25px; }
      .grid-2 { grid-template-columns: 1fr 1fr; gap: 20px; }
      .kpi-container { gap: 15px; }
      .kpi-card { padding: 20px; }
      .kpi-card p.amount { font-size: 1.5rem; }
      .kpi-card p.sub-text { font-size: 0.8rem; }
      table { font-size: 0.9rem; }
    }

    @media(max-width: 600px) {
      .card h2 { font-size: 1.1rem; }
      table .col-type, table .col-category { display: none; }
      th, td { padding: 8px 5px; }
    }

    @media print {
      body { background: white; padding: 0; }
      .filter-bar, form, .action-btn-cell, .btn-pdf, header button { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
      table .col-type, table .col-category { display: table-cell !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Finance Dashboard</h1>
    <button class="btn-pdf" onclick="window.print()">🖨️ Export PDF / Print</button>
  </header>

  <!-- Filters, Currency & Sorting -->
  <div class="filter-bar">
    <!-- Currency Selector -->
    <select id="currency-select" onchange="renderDashboard()">
      <option value="€" selected>€ (EUR)</option>
      <option value="$">$ (USD)</option>
    <select>

    <select id="year-filter" onchange="renderDashboard()"></select>
    <select id="month-filter" onchange="renderDashboard()">
      <option value="ALL">All Months</option>
      <option value="0">Jan</option><option value="1">Feb</option>
      <option value="2">Mar</option><option value="3">Apr</option>
      <option value="4">May</option><option value="5">Jun</option>
      <option value="6">Jul</option><option value="7">Aug</option>
      <option value="8">Sep</option><option value="9">Oct</option>
      <option value="10">Nov</option><option value="11">Dec</option>
    </select>
    <select id="sort-order" onchange="renderDashboard()">
      <option value="NEWEST">Sort: Newest First</option>
      <option value="OLDEST">Sort: Oldest First</option>
    </select>
  </div>

  <!-- Main KPI Summaries -->
  <div class="kpi-container">
    <div class="kpi-card">
      <h3>Total Income</h3>
      <p id="kpi-income" class="amount income">$0</p>
      <p id="kpi-deductions" class="sub-text">Less: $0 Exp</p>
    </div>
    <div class="kpi-card">
      <h3>Expenses</h3>
      <p id="kpi-expense" class="amount expense">$0</p>
      <p id="kpi-savings-sub" class="sub-text">Saved: $0</p>
    </div>
    <div class="kpi-card">
      <h3>Remaining</h3>
      <p id="kpi-balance" class="amount balance">$0</p>
      <p id="kpi-status" class="sub-text">Net Balance</p>
    </div>
  </div>

  <!-- Loan Tracker Summary -->
  <div class="loan-box">
    <div>Owed to You (Loans Given)<strong id="loan-given" class="income">$0</strong></div>
    <div>You Owe (Loans Taken)<strong id="loan-taken" class="expense">$0</strong></div>
  </div>

  <!-- Entry Form & Chart -->
  <div class="grid-2">
    <div class="card">
      <h2 id="form-title">Add Entry</h2>
      <form id="entry-form">
        <input type="hidden" id="edit-row-id">
        <input type="date" id="txn-date" required>
        
        <select id="txn-type">
          <option value="Expense">Expense</option>
          <option value="Income">Income</option>
          <option value="Savings">Savings</option>
          <option value="Loan Given">Loan Given (Money You Lent)</option>
          <option value="Loan Taken">Loan Taken (Money You Borrowed)</option>
        </select>

        <select id="txn-category" onchange="handleCategoryChange(this)">
          <option value="Food">Food</option>
          <option value="Housing">Housing</option>
          <option value="Transport">Transport</option>
          <option value="Salary">Salary</option>
          <option value="Loans / Debt">Loans / Debt</option>
          <option value="Other">Other</option>
          <option value="NEW">+ Add New Category...</option>
        </select>

        <input type="number" step="0.01" id="txn-amount" placeholder="Amount" required>
        <input type="text" id="txn-notes" placeholder="Notes (e.g. Person Name / Detail)">
        <button type="submit" id="save-btn" class="submit-btn">Save Entry</button>
      </form>
    </div>

    <div class="card">
      <h2>Expense Breakdown</h2>
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <!-- Data Table -->
  <div class="card">
    <h2>Transactions</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th class="col-type">Type</th>
          <th class="col-category">Category</th>
          <th id="th-amount">Amount</th>
          <th>Notes</th>
          <th class="action-btn-cell">Acts</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script>
  // PASTE YOUR DEPLOYED GOOGLE WEB APP URL HERE:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrV7xOSGEy9KLZhWeWAigBajrIPAhj8Dh_iVKlwZf1dMbMSpWXsXwAy1asfYhe09Td3A/exec";
  let rawData = [];
  let chartInstance = null;

  function setTodayDate() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("txn-date").value = today;
  }

  setTodayDate();

  async function loadData() {
    try {
      const res = await fetch(SCRIPT_URL);
      rawData = await res.json();
      populateYears();
      populateCategories();
      renderDashboard();
    } catch(err) { console.error("Error loading data:", err); }
  }

  function populateYears() {
    const yearSelect = document.getElementById("year-filter");
    const years = [...new Set(rawData.map(d => new Date(d.date).getFullYear()))].filter(y => !isNaN(y)).sort().reverse();
    const currentYear = new Date().getFullYear();
    if (!years.includes(currentYear)) years.unshift(currentYear);
    
    yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join("");
  }

  function populateCategories() {
    const catSelect = document.getElementById("txn-category");
    const existingCats = [...new Set(rawData.map(d => d.category))].filter(Boolean);
    const defaults = ["Food", "Housing", "Transport", "Salary", "Loans / Debt", "Other"];
    const allCats = [...new Set([...defaults, ...existingCats])];

    catSelect.innerHTML = allCats.map(c => `<option value="${c}">${c}</option>`).join("") + 
      `<option value="NEW">+ Add New Category...</option>`;
  }

  function handleCategoryChange(selectEl) {
    if (selectEl.value === "NEW") {
      const newCat = prompt("Enter new category name:");
      if (newCat && newCat.trim() !== "") {
        const cleanCat = newCat.trim();
        const opt = document.createElement("option");
        opt.value = cleanCat;
        opt.text = cleanCat;
        selectEl.add(opt, selectEl.options[selectEl.options.length - 1]);
        selectEl.value = cleanCat;
      } else {
        selectEl.selectedIndex = 0;
      }
    }
  }

  function renderDashboard() {
    const curr = document.getElementById("currency-select").value;
    const selectedYear = document.getElementById("year-filter").value;
    const selectedMonth = document.getElementById("month-filter").value;
    const sortOrder = document.getElementById("sort-order").value;

    // Update Table Column Header with Currency Symbol
    document.getElementById("th-amount").innerText = `Amount (${curr})`;

    const filtered = rawData.filter(d => {
      const dt = new Date(d.date);
      const matchYear = dt.getFullYear() == selectedYear;
      const matchMonth = selectedMonth === "ALL" || dt.getMonth() == selectedMonth;
      return matchYear && matchMonth;
    });

    filtered.sort((a,b) => {
      const dA = new Date(a.date), dB = new Date(b.date);
      return sortOrder === "NEWEST" ? dB - dA : dA - dB;
    });

    let inc = 0, exp = 0, sav = 0, loanGiven = 0, loanTaken = 0;
    const catTotals = {};

    filtered.forEach(d => {
      const amt = parseFloat(d.amount) || 0;
      if (d.type === "Income") inc += amt;
      if (d.type === "Expense") {
        exp += amt;
        catTotals[d.category] = (catTotals[d.category] || 0) + amt;
      }
      if (d.type === "Savings") sav += amt;
      if (d.type === "Loan Given") loanGiven += amt;
      if (d.type === "Loan Taken") loanTaken += amt;
    });

    const remainingBalance = inc - exp - sav - loanGiven + loanTaken;

    // Apply currency dynamically
    document.getElementById("kpi-income").innerText = `${curr}${Math.round(inc)}`;
    document.getElementById("kpi-deductions").innerText = `-${curr}${Math.round(exp)} Exp, -${curr}${Math.round(sav)} Sav`;

    document.getElementById("kpi-expense").innerText = `${curr}${Math.round(exp)}`;
    document.getElementById("kpi-savings-sub").innerText = `Saved: ${curr}${Math.round(sav)}`;

    document.getElementById("loan-given").innerText = `${curr}${Math.round(loanGiven)}`;
    document.getElementById("loan-taken").innerText = `${curr}${Math.round(loanTaken)}`;

    const balanceEl = document.getElementById("kpi-balance");
    balanceEl.innerText = `${curr}${Math.round(remainingBalance)}`;
    balanceEl.style.color = remainingBalance >= 0 ? "#2980b9" : "#e74c3c";

    renderTable(filtered, curr);
    renderChart(catTotals, curr);
  }

  function renderTable(data, curr) {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = data.map(d => {
      const dt = new Date(d.date);
      const shortDate = !isNaN(dt) ? `${dt.getMonth()+1}/${dt.getDate()}` : d.date;
      const shortNotes = d.notes ? (d.notes.length > 15 ? d.notes.substring(0,12) + '...' : d.notes) : "";

      return `
      <tr>
        <td title="${d.date}">${shortDate}</td>
        <td class="col-type">${d.type}</td>
        <td class="col-category">${d.category}</td>
        <td>${curr}${parseFloat(d.amount).toFixed(2)}</td>
        <td title="${d.notes || ''}">${shortNotes}</td>
        <td class="action-btn-cell">
          <button class="action-btn edit-btn" onclick="editRow(${d.rowId})" title="Edit">✎</button>
          <button class="action-btn delete-btn" onclick="deleteRow(${d.rowId})" title="Delete">✕</button>
        </td>
      </tr>
    `}).join("");
  }

  function renderChart(catTotals, curr) {
    const ctx = document.getElementById("expenseChart").getContext("2d");
    if (chartInstance) chartInstance.destroy();

    if(Object.keys(catTotals).length === 0) {
      document.getElementById("expenseChart").style.display = 'none';
      return;
    }
    document.getElementById("expenseChart").style.display = 'block';

    chartInstance = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: Object.keys(catTotals),
        datasets: [{
          data: Object.values(catTotals),
          backgroundColor: ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71", "#e67e22", "#16a085"],
          borderWidth: 1
        }]
      },
      options: { 
        animation: { animateScale: true, animateRotate: true },
        plugins: { 
          legend: { position: 'bottom', labels: { boxWidth: 12, padding: 8, font: {size: 11} } },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` ${context.label}: ${curr}${context.raw.toFixed(2)}`;
              }
            }
          }
        }
      }
    });
  }

  document.getElementById("entry-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const saveBtn = document.getElementById("save-btn");
    const rowId = document.getElementById("edit-row-id").value;
    const action = rowId ? "update" : "create";
    
    saveBtn.innerText = "Saving...";
    saveBtn.disabled = true;

    const payload = {
      action: action,
      rowId: rowId ? parseInt(rowId) : null,
      date: document.getElementById("txn-date").value,
      type: document.getElementById("txn-type").value,
      category: document.getElementById("txn-category").value,
      amount: document.getElementById("txn-amount").value,
      notes: document.getElementById("txn-notes").value
    };

    try {
      await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
      document.getElementById("entry-form").reset();
      document.getElementById("edit-row-id").value = "";
      document.getElementById("form-title").innerText = "Add Entry";
      setTodayDate();
      
      setTimeout(loadData, 1000);
    } catch(err) {
      console.error("Submission failed:", err);
      saveBtn.innerText = "Error!";
    } finally {
      saveBtn.innerText = "Save Entry";
      saveBtn.disabled = false;
    }
  });

  function editRow(rowId) {
    const item = rawData.find(d => d.rowId === rowId);
    if (!item) return;
    document.getElementById("edit-row-id").value = item.rowId;
    document.getElementById("txn-date").value = item.date || new Date().toISOString().split('T')[0];
    document.getElementById("txn-type").value = item.type;
    document.getElementById("txn-category").value = item.category;
    document.getElementById("txn-amount").value = item.amount;
    document.getElementById("txn-notes").value = item.notes;
    document.getElementById("form-title").innerText = "Edit Entry";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deleteRow(rowId) {
    if (confirm("Delete this entry permanently?")) {
      await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", rowId: rowId }) });
      setTimeout(loadData, 1000);
    }
  }

  loadData();
</script>
</body>
</html>
