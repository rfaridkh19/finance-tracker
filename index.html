<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Tracker</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Base Reset & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    body.rtl {
      direction: rtl;
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: fadeInDown 0.4s ease-out;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand i {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Buttons & Interactive Elements */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      outline: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    .btn-icon {
      padding: 10px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-icon:hover {
      color: var(--primary);
      background: #e0e7ff;
      transform: rotate(15deg);
    }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
      animation: fadeInUp 0.5s ease-out;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .card-amount {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .card-amount.income { color: var(--success); }
    .card-amount.expense { color: var(--danger); }

    /* Main Section & Table Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .data-table-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out;
    }

    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    body.rtl table {
      text-align: right;
    }

    th, td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 600;
    }

    tbody tr {
      transition: var(--transition);
    }

    tbody tr:hover {
      background-color: #f1f5f9;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.income { background: #d1fae5; color: #065f46; }
    .badge.expense { background: #fee2e2; color: #991b1b; }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .action-btn.edit:hover { color: var(--primary); background: #e0e7ff; }
    .action-btn.delete:hover { color: var(--danger); background: #fee2e2; }

    /* Modal Popup Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      padding: 24px;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .close-btn:hover { color: var(--text); }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
      background: #f8fafc;
    }

    .input-field:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10000;
    }

    body.rtl .toast {
      right: auto;
      left: 24px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Animations Keyframes */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Breakdown */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }
      .header-actions {
        justify-content: space-between;
      }
      .modal-card {
        padding: 20px;
      }
      .modal-actions {
        flex-direction: column-reverse;
      }
      .modal-actions button {
        width: 100%;
      }
      .input-field {
        font-size: 16px; /* Prevents auto-zoom in iOS Safari */
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <header>
      <div class="brand">
        <i class="fa-solid fa-wallet"></i>
        <h1 data-i18n="appTitle">Finance Tracker</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openModalForCreate()">
          <i class="fa-solid fa-plus"></i>
          <span data-i18n="newEntry">New Entry</span>
        </button>
        <button class="btn-icon" onclick="loadData()" title="Refresh Data">
          <i class="fa-solid fa-rotate-right" id="refresh-icon"></i>
        </button>
        <button class="btn-icon" onclick="toggleLanguage()" title="Toggle Language">
          <i class="fa-solid fa-language"></i>
        </button>
      </div>
    </header>

    <!-- Summary Cards -->
    <div class="summary-grid">
      <div class="card">
        <div class="card-header">
          <span data-i18n="totalIncome">Total Income</span>
          <i class="fa-solid fa-arrow-down-long" style="color: var(--success);"></i>
        </div>
        <div class="card-amount income" id="total-income">$0.00</div>
      </div>
      <div class="card">
        <div class="card-header">
          <span data-i18n="totalExpense">Total Expense</span>
          <i class="fa-solid fa-arrow-up-long" style="color: var(--danger);"></i>
        </div>
        <div class="card-amount expense" id="total-expense">$0.00</div>
      </div>
      <div class="card">
        <div class="card-header">
          <span data-i18n="netBalance">Net Balance</span>
          <i class="fa-solid fa-scale-balanced" style="color: var(--primary);"></i>
        </div>
        <div class="card-amount" id="net-balance">$0.00</div>
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="content-grid">
      <div class="data-table-container">
        <div class="table-header">
          <h2 style="font-size: 1.1rem; font-weight: 700;" data-i18n="transactions">Transactions</h2>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-i18n="date">Date</th>
                <th data-i18n="type">Type</th>
                <th data-i18n="category">Category</th>
                <th data-i18n="amount">Amount</th>
                <th data-i18n="notes">Notes</th>
                <th style="text-align: center;" data-i18n="actions">Actions</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 24px;">
                  <i class="fa-solid fa-spinner fa-spin"></i> Loading transactions...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Modal Popup -->
  <div id="entry-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="form-title" data-i18n="newEntry">New Entry</h3>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form id="entry-form">
        <input type="hidden" id="edit-row-id" name="rowId" />

        <div class="form-group">
          <label for="txn-date" data-i18n="date">Date</label>
          <input type="date" id="txn-date" required class="input-field" />
        </div>

        <div class="form-group">
          <label for="txn-type" data-i18n="type">Type</label>
          <select id="txn-type" class="input-field" onchange="populateCategories()">
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txn-category" data-i18n="category">Category</label>
          <select id="txn-category" class="input-field"></select>
        </div>

        <div class="form-group">
          <label for="txn-amount" data-i18n="amount">Amount</label>
          <input type="number" id="txn-amount" step="0.01" required class="input-field" placeholder="0.00" />
        </div>

        <div class="form-group">
          <label for="txn-notes" data-i18n="notes">Notes</label>
          <input type="text" id="txn-notes" class="input-field" placeholder="..." />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()" data-i18n="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Element -->
  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-check" style="color: var(--success);"></i>
    <span id="toast-message">Success!</span>
  </div>

  <script>
    // Config & Deployment Link
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8XQ7kN-_25iYTu2aJKogcLWtA8dWeF_VaUG0DuuJoMh_GxriTrxj0nlL1A9ehuKJN/exec";

    // Application State
    let rawData = [];
    let isPersian = false;

    // Categories Reference
    const categories = {
      Expense: ["Food", "Transport", "Utilities", "Rent", "Entertainment", "Shopping", "Health", "Other"],
      Income: ["Salary", "Freelance", "Investments", "Gift", "Other"]
    };

    // Translation Dictionaries
    const translations = {
      en: {
        appTitle: "Finance Tracker",
        newEntry: "New Entry",
        editEntry: "Edit Entry",
        totalIncome: "Total Income",
        totalExpense: "Total Expense",
        netBalance: "Net Balance",
        transactions: "Transactions",
        date: "Date",
        type: "Type",
        category: "Category",
        amount: "Amount",
        notes: "Notes",
        actions: "Actions",
        cancel: "Cancel",
        save: "Save",
        saveSuccess: "Transaction saved successfully!",
        deleteSuccess: "Transaction deleted successfully!",
        noData: "No transactions found."
      },
      fa: {
        appTitle: "مدیریت امور مالی",
        newEntry: "ثبت تراکنش جدید",
        editEntry: "ویرایش تراکنش",
        totalIncome: "مجموع درآمد",
        totalExpense: "مجموع هزینه",
        netBalance: "موجودی کل",
        transactions: "تراکنش‌ها",
        date: "تاریخ",
        type: "نوع",
        category: "دسته‌بندی",
        amount: "مبلغ",
        notes: "یادداشت",
        actions: "عملیات",
        cancel: "انصراف",
        save: "ذخیره",
        saveSuccess: "تراکنش با موفقیت ثبت شد!",
        deleteSuccess: "تراکنش با موفقیت حذف شد!",
        noData: "هیچ تراکنشی یافت نشد."
      }
    };

    // Initialize App
    window.addEventListener("DOMContentLoaded", () => {
      populateCategories();
      resetFormDate();
      loadData();
    });

    // Populate Category Dropdown dynamically based on Type
    function populateCategories() {
      const type = document.getElementById("txn-type").value;
      const catSelect = document.getElementById("txn-category");
      catSelect.innerHTML = "";

      categories[type].forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.text = cat;
        catSelect.appendChild(opt);
      });
    }

    // Load Data from Google Apps Script
    async function loadData() {
      const refreshIcon = document.getElementById("refresh-icon");
      refreshIcon.classList.add("fa-spin");

      try {
        const response = await fetch(`${SCRIPT_URL}?action=read`);
        rawData = await response.json();
        renderTable();
        updateSummaryCards();
      } catch (err) {
        console.error("Failed to load data:", err);
      } finally {
        refreshIcon.classList.remove("fa-spin");
      }
    }

    // Render Data Table
    function renderTable() {
      const tbody = document.getElementById("table-body");
      const lang = isPersian ? 'fa' : 'en';
      tbody.innerHTML = "";

      if (!rawData || rawData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 24px;">
              ${translations[lang].noData}
            </td>
          </tr>`;
        return;
      }

      // Sort descending by date
      const sortedData = [...rawData].sort((a, b) => new Date(b.date) - new Date(a.date));

      sortedData.forEach(item => {
        const tr = document.createElement("tr");
        const formattedDate = item.date ? item.date.split("T")[0] : "";
        const formattedAmount = Number(item.amount).toLocaleString("en-US", { minimumFractionDigits: 2 });
        const badgeClass = item.type === "Income" ? "income" : "expense";

        tr.innerHTML = `
          <td>${formattedDate}</td>
          <td><span class="badge ${badgeClass}">${item.type}</span></td>
          <td>${item.category || "-"}</td>
          <td style="font-weight: 600;">$${formattedAmount}</td>
          <td style="color: var(--text-muted);">${item.notes || "-"}</td>
          <td style="text-align: center;">
            <button class="action-btn edit" onclick="editRow('${item.rowId}')" title="Edit">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button class="action-btn delete" onclick="deleteRow('${item.rowId}')" title="Delete">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Update Summary Header Cards
    function updateSummaryCards() {
      let incomeTotal = 0;
      let expenseTotal = 0;

      rawData.forEach(item => {
        const val = parseFloat(item.amount) || 0;
        if (item.type === "Income") incomeTotal += val;
        if (item.type === "Expense") expenseTotal += val;
      });

      const net = incomeTotal - expenseTotal;

      document.getElementById("total-income").innerText = `$${incomeTotal.toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
      document.getElementById("total-expense").innerText = `$${expenseTotal.toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
      
      const netElem = document.getElementById("net-balance");
      netElem.innerText = `$${net.toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
      netElem.style.color = net >= 0 ? "var(--text)" : "var(--danger)";
    }

    // Open Modal for New Entry
    function openModalForCreate() {
      resetForm();
      const lang = isPersian ? 'fa' : 'en';
      document.getElementById("form-title").innerText = translations[lang].newEntry;
      document.getElementById("entry-modal").classList.add("active");
    }

    // Open Modal for Edit Entry
    function editRow(rowId) {
      const item = rawData.find(d => String(d.rowId) === String(rowId));
      if (!item) return;

      document.getElementById("edit-row-id").value = item.rowId;
      document.getElementById("txn-date").value = item.date ? item.date.split('T')[0] : new Date().toISOString().split('T')[0];
      document.getElementById("txn-type").value = item.type || "Expense";
      
      populateCategories();

      const catSelect = document.getElementById("txn-category");
      let categoryExists = Array.from(catSelect.options).some(opt => opt.value === item.category);

      if (!categoryExists && item.category) {
        const newOpt = document.createElement("option");
        newOpt.value = item.category;
        newOpt.text = item.category;
        catSelect.add(newOpt);
      }
      catSelect.value = item.category;

      document.getElementById("txn-amount").value = item.amount || "";
      document.getElementById("txn-notes").value = item.notes || "";

      const lang = isPersian ? 'fa' : 'en';
      document.getElementById("form-title").innerText = translations[lang].editEntry;
      document.getElementById("entry-modal").classList.add("active");
    }

    // Close Modal
    function closeModal() {
      document.getElementById("entry-modal").classList.remove("active");
      resetForm();
    }

    // Reset Form Fields
    function resetForm() {
      document.getElementById("edit-row-id").value = "";
      document.getElementById("entry-form").reset();
      resetFormDate();
      populateCategories();
    }

    function resetFormDate() {
      document.getElementById("txn-date").value = new Date().toISOString().split('T')[0];
    }

    // Form Submit Handler
    document.getElementById("entry-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const lang = isPersian ? 'fa' : 'en';
      const editId = document.getElementById("edit-row-id").value;

      const payload = {
        action: editId ? "update" : "create",
        rowId: editId ? editId : null,
        date: document.getElementById("txn-date").value,
        type: document.getElementById("txn-type").value,
        category: document.getElementById("txn-category").value,
        amount: document.getElementById("txn-amount").value,
        notes: document.getElementById("txn-notes").value
      };

      closeModal();
      showToast(translations[lang].saveSuccess);

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload)
      });

      setTimeout(loadData, 1200);
    });

    // Delete Row Handler
    async function deleteRow(rowId) {
      if (!confirm("Are you sure you want to delete this entry?")) return;

      const lang = isPersian ? 'fa' : 'en';
      showToast(translations[lang].deleteSuccess);

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ action: "delete", rowId: String(rowId) })
      });

      setTimeout(loadData, 1200);
    }

    // Toast Notification Handler
    function showToast(message) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-message").innerText = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    // Toggle Language Handler (EN / FA)
    function toggleLanguage() {
      isPersian = !isPersian;
      const lang = isPersian ? 'fa' : 'en';
      
      document.body.classList.toggle("rtl", isPersian);

      document.querySelectorAll("[data-i18n]").forEach(elem => {
        const key = elem.getAttribute("data-i18n");
        if (translations[lang][key]) {
          elem.innerText = translations[lang][key];
        }
      });

      renderTable();
    }
  </script>
</body>
</html>
