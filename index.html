<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background: #f4f7f6; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; }
    select, input, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    
    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .kpi-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; transition: transform 0.2s; }
    .kpi-card:hover { transform: translateY(-3px); }
    .kpi-card h3 { font-size: 0.9rem; color: #666; margin-bottom: 5px; }
    .kpi-card p { font-size: 1.5rem; font-weight: bold; }
    .income { color: #27ae60; } .expense { color: #e74c3c; } .savings { color: #2980b9; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    th { background: #fafafa; }
    .action-btn { padding: 5px 8px; font-size: 0.8rem; margin-right: 5px; border-radius: 4px; }
    .edit-btn { background: #f39c12; }
    .delete-btn { background: #e74c3c; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Finance Dashboard</h1>
  </header>

  <!-- Filters -->
  <div class="filter-bar">
    <select id="year-filter" onchange="renderDashboard()"></select>
    <select id="month-filter" onchange="renderDashboard()">
      <option value="ALL">All Months</option>
      <option value="0">January</option><option value="1">February</option>
      <option value="2">March</option><option value="3">April</option>
      <option value="4">May</option><option value="5">June</option>
      <option value="6">July</option><option value="7">August</option>
      <option value="8">September</option><option value="9">October</option>
      <option value="10">November</option><option value="11">December</option>
    </select>
  </div>

  <!-- KPI Summaries -->
  <div class="kpi-container">
    <div class="kpi-card"><h3>Income</h3><p id="kpi-income" class="income">$0.00</p></div>
    <div class="kpi-card"><h3>Expenses</h3><p id="kpi-expense" class="expense">$0.00</p></div>
    <div class="kpi-card"><h3>Savings</h3><p id="kpi-savings" class="savings">$0.00</p></div>
  </div>

  <!-- Layout: Form & Chart -->
  <div class="grid-2">
    <div class="card">
      <h2 id="form-title">Add Entry</h2>
      <form id="entry-form">
        <input type="hidden" id="edit-row-id">
        <input type="date" id="txn-date" required>
        <select id="txn-type">
          <option value="Expense">Expense</option>
          <option value="Income">Income</option>
          <option value="Savings">Savings</option>
        </select>
        <select id="txn-category">
          <option value="Food">Food</option>
          <option value="Housing">Housing</option>
          <option value="Transport">Transport</option>
          <option value="Salary">Salary</option>
          <option value="Other">Other</option>
        </select>
        <input type="number" step="0.01" id="txn-amount" placeholder="Amount" required>
        <input type="text" id="txn-notes" placeholder="Notes">
        <button type="submit" id="save-btn">Save Entry</button>
      </form>
    </div>

    <div class="card">
      <h2>Expense Breakdown</h2>
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <!-- Data Table -->
  <div class="card">
    <h2>Transactions</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Notes</th><th>Actions</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzL0JJVTm8Nqj1WEJpsOeKWtQVVFMHq0VuTIVsLk_dhwlh1-gIOS_1LRlOprNtT1BLF1w/exec";
  let rawData = [];
  let chartInstance = null;

  document.getElementById("txn-date").valueAsDate = new Date();

  async function loadData() {
    try {
      const res = await fetch(SCRIPT_URL);
      rawData = await res.json();
      populateYears();
      renderDashboard();
    } catch(err) { console.error("Error loading data:", err); }
  }

  function populateYears() {
    const yearSelect = document.getElementById("year-filter");
    const years = [...new Set(rawData.map(d => new Date(d.date).getFullYear()))].sort().reverse();
    const currentYear = new Date().getFullYear();
    if (!years.includes(currentYear)) years.unshift(currentYear);
    
    yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join("");
  }

  function renderDashboard() {
    const selectedYear = document.getElementById("year-filter").value;
    const selectedMonth = document.getElementById("month-filter").value;

    const filtered = rawData.filter(d => {
      const dt = new Date(d.date);
      const matchYear = dt.getFullYear() == selectedYear;
      const matchMonth = selectedMonth === "ALL" || dt.getMonth() == selectedMonth;
      return matchYear && matchMonth;
    });

    // Calculate totals
    let inc = 0, exp = 0, sav = 0;
    const catTotals = {};

    filtered.forEach(d => {
      const amt = parseFloat(d.amount) || 0;
      if (d.type === "Income") inc += amt;
      if (d.type === "Expense") {
        exp += amt;
        catTotals[d.category] = (catTotals[d.category] || 0) + amt;
      }
      if (d.type === "Savings") sav += amt;
    });

    document.getElementById("kpi-income").innerText = `$${inc.toFixed(2)}`;
    document.getElementById("kpi-expense").innerText = `$${exp.toFixed(2)}`;
    document.getElementById("kpi-savings").innerText = `$${sav.toFixed(2)}`;

    renderTable(filtered);
    renderChart(catTotals);
  }

  function renderTable(data) {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = data.map(d => `
      <tr>
        <td>${d.date}</td>
        <td>${d.type}</td>
        <td>${d.category}</td>
        <td>$${parseFloat(d.amount).toFixed(2)}</td>
        <td>${d.notes || ""}</td>
        <td>
          <button class="action-btn edit-btn" onclick="editRow(${d.rowId})">Edit</button>
          <button class="action-btn delete-btn" onclick="deleteRow(${d.rowId})">Delete</button>
        </td>
      </tr>
    `).join("");
  }

  function renderChart(catTotals) {
    const ctx = document.getElementById("expenseChart").getContext("2d");
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: Object.keys(catTotals),
        datasets: [{
          data: Object.values(catTotals),
          backgroundColor: ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71"]
        }]
      },
      options: { animation: { animateScale: true, animateRotate: true } }
    });
  }

  document.getElementById("entry-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const rowId = document.getElementById("edit-row-id").value;
    const action = rowId ? "update" : "create";

    const payload = {
      action: action,
      rowId: rowId ? parseInt(rowId) : null,
      date: document.getElementById("txn-date").value,
      type: document.getElementById("txn-type").value,
      category: document.getElementById("txn-category").value,
      amount: document.getElementById("txn-amount").value,
      notes: document.getElementById("txn-notes").value
    };

    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
    document.getElementById("entry-form").reset();
    document.getElementById("edit-row-id").value = "";
    document.getElementById("form-title").innerText = "Add Entry";
    loadData();
  });

  function editRow(rowId) {
    const item = rawData.find(d => d.rowId === rowId);
    if (!item) return;
    document.getElementById("edit-row-id").value = item.rowId;
    document.getElementById("txn-date").value = item.date;
    document.getElementById("txn-type").value = item.type;
    document.getElementById("txn-category").value = item.category;
    document.getElementById("txn-amount").value = item.amount;
    document.getElementById("txn-notes").value = item.notes;
    document.getElementById("form-title").innerText = "Edit Entry";
  }

  async function deleteRow(rowId) {
    if (confirm("Delete this entry?")) {
      await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", rowId: rowId }) });
      loadData();
    }
  }

  loadData();
</script>
</body>
</html>
